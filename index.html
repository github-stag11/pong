<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Pong</title>
  <meta name="description" content="Peer-to-peer multiplayer Pong in a polygon arena, played in space.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ffd27a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="stage"></canvas>

  <main id="menu" class="panel center">
    <h1>Space Pong</h1>
    <p class="tag">One arena. One side per player. Endless play.</p>
    <label>Callsign
      <input id="name" maxlength="16" placeholder="Pilot" autocomplete="off">
    </label>
    <button id="btn-play" class="primary">Play</button>
    <p id="menu-status" class="status"></p>
    <p class="hint">Press Play to join the match in progress, or start one if none is running. Players connect directly peer-to-peer. A public signaling broker only relays the connection setup.</p>
  </main>

  <section id="hud" class="hidden">
    <aside id="scores" class="panel"><h3>Lost points</h3><ul id="score-list"></ul></aside>
    <div id="toolbar">
      <button id="btn-mute" title="Toggle sound (M)">Sound on</button>
    </div>
    <p id="role" class="role"></p>
    <p id="controls">Move: <kbd>&larr;</kbd> <kbd>&rarr;</kbd> or <kbd>A</kbd> <kbd>D</kbd></p>
  </section>

  <div id="toast" class="hidden" role="status"></div>
  <div id="overlay" class="panel center hidden" role="alertdialog">
    <h2 id="overlay-title"></h2>
    <p id="overlay-text"></p>
    <button id="btn-reload" class="primary">Back to menu</button>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
